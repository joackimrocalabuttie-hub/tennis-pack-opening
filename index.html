<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tennis Pack</title>
<!-- Ajout de ?v=2 pour forcer la mise à jour chez tous les joueurs -->
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="bg-anime"></div>

<nav>
    <span class="logo">TENNIS&nbsp;PACK</span>
    <div class="nav-btns">
        <button data-vue="accueil">Accueil</button>
        <button data-vue="album">Album</button>
    </div>
</nav>

<!-- ================= ACCUEIL ================= -->
<section id="vue-accueil" class="vue active">
    <h1 class="titre-section">TENNIS PACK</h1>
    <p class="astuce">Ouvre des packs et collectionne les joueurs !</p>

    <div class="scene-pack" id="scene-accueil">
        <div class="pack-3d flottant" id="pack-accueil">
            <div class="face face-tranche"></div>
            <div class="face face-arriere"></div>
            <div class="face face-avant">
                <div class="pack-img-fallback">
                    <h2>TENNIS<br>PACK</h2>
                </div>
                <!-- Le lien vers l'image reste identique -->
                <img src="images/pack-tenant.png" alt="" class="pack-img"
                     onerror="this.classList.add('ko')">
                <div class="pack-tissu"></div>
                <div class="foil-effect"></div>
            </div>
        </div>
    </div>

    <p id="timer-display">Chargement...</p>
    <button id="btn-ouvrir" disabled>Ouvrir un pack</button>
</section>

<!-- ================= ALBUM ================= -->
<section id="vue-album" class="vue">
    <h1 class="titre-section">Mon Album de Joueurs</h1>

    <div class="progression">
        <div class="progression-tete">
            <span id="progression-texte">0 / 0 joueurs</span>
            <span id="progression-pct">0 %</span>
        </div>
        <div class="progression-barre">
            <div class="progression-remplissage" id="progression-remplissage"></div>
        </div>
    </div>

    <div class="barre-outils">
        <div class="segmente">
            <button class="seg-btn actif" data-vue-album="toutes">Toutes <span class="seg-compte" id="compte-toutes">0</span></button>
            <button class="seg-btn" data-vue-album="possedees">Possédées <span class="seg-compte" id="compte-possedees">0</span></button>
            <button class="seg-btn" data-vue-album="manquantes">Manquantes <span class="seg-compte" id="compte-manquantes">0</span></button>
        </div>
        <label class="champ-tri">Trier par
            <select id="tri-album">
                <option value="rarete-desc">Rareté (rares d'abord)</option>
                <option value="rarete-asc">Rareté (communes d'abord)</option>
                <option value="nom-asc">Nom (A → Z)</option>
                <option value="nom-desc">Nom (Z → A)</option>
                <option value="recent">Dernières obtenues</option>
            </select>
        </label>
    </div>

    <p class="album-vide" id="album-vide" hidden></p>
    <div class="cartes-grid" id="grille-album"></div>
</section>

<!-- ================= OUVERTURE ================= -->
<div id="vue-ouverture" tabindex="0">
    <div class="fond-glow" id="fond-ouverture"></div>
    <div class="rayons" id="rayons"></div>

    <div class="scene-pack" id="scene-ouverture">
        <div class="pack-3d grand pret" id="pack-gros-plan">
            <div class="face face-tranche"></div>
            <div class="face face-arriere"></div>
            <div class="face face-avant">
                <div class="pack-img-fallback">
                    <h2>TENNIS<br>PACK</h2>
                </div>
                <!-- Le lien vers l'image reste identique -->
                <img src="images/pack-tenant.png" alt="" class="pack-img"
                     onerror="this.classList.add('ko')">
                <div class="pack-tissu"></div>
                <div class="foil-effect"></div>
            </div>

            <!-- Déchirure -->
            <div class="dechirure" id="dechirure">
                <div class="lame haut" id="lame-haut"></div>
                <div class="lame bas" id="lame-bas"></div>
                <div class="couture" id="couture"></div>
                <div class="fente-lumiere" id="fente-lumiere"></div>
            </div>
        </div>
    </div>

    <div class="badge-nouveau" id="badge-nouveau">NOUVEAU !</div>
    <div class="flash" id="flash"></div>
    <div id="particules"></div>
    <div id="points" class="points"></div>
    <div class="tuto-clic" id="tuto-clic">Clique sur le pack pour l'ouvrir !</div>

    <div class="carte-cachee" id="carte-affichee"></div>
</div>

<!-- Ajout de ?v=2 pour forcer la mise à jour chez tous les joueurs -->
<script src="script.js?v=2"></script>
</body>
</html>
